<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B1020">
<meta name="description" content="Arrow47 — an arrow escape puzzle. Free every arrow from the grid. Endless always-solvable levels, daily puzzles and rush mode. Works offline.">
<title>Arrow47 — Arrow Escape Puzzle</title>
<style>
/* ============================= THEME ============================= */
:root{
  --bg:#0B1020; --panel:#121A2D; --panel2:#151F36; --line:rgba(255,255,255,.08);
  --green:#35E6A1; --blue:#55B8FF; --amber:#FFD166; --red:#FF647C;
  --text:#F5F7FF; --muted:#9AA8C7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Avenir Next','Trebuchet MS','Segoe UI',Verdana,sans-serif;
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit; touch-action:manipulation;}
#app{position:fixed; inset:0; padding-left:var(--sal); padding-right:var(--sar);}

/* In Playables mode the host owns audio — hide our sound controls. */
body.platform-playables .sound-only{display:none!important;}

/* ============================= SCREENS ============================= */
.screen{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
  transition:opacity .28s ease, transform .28s ease;}
.screen.hidden{opacity:0; pointer-events:none; transform:translateY(10px);}
#game{z-index:1;}
#home{z-index:2; overflow-y:auto;}

/* ============================= HUD ============================= */
#game{padding-top:var(--sat);}
#hud{display:flex; align-items:center; gap:10px; padding:10px 12px 6px;}
.level-chip{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:6px 10px; display:flex; flex-direction:column; align-items:center; line-height:1; min-width:62px;}
.level-chip .lbl{font-size:9px; letter-spacing:.16em; color:var(--muted); font-weight:700;}
.level-chip .num{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px;}
.hud-mid{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
.progress{height:5px; background:#1B2540; border-radius:99px; overflow:hidden;}
#progressFill{height:100%; width:0%; background:var(--green); border-radius:99px;
  transition:width .35s cubic-bezier(.22,1,.36,1);}
#progressFill.low{background:var(--red); transition:width .12s linear;}
.count{font-size:12px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums;}
.count.pop{animation:pop .32s ease;}
@keyframes pop{40%{transform:scale(1.2); color:var(--green);}}
.hud-actions{display:flex; gap:7px;}

/* ============================= BUTTONS ============================= */
.icon-btn{width:42px; height:42px; border-radius:12px; background:var(--panel);
  border:1px solid var(--line); color:var(--text); display:grid; place-items:center;
  cursor:pointer; transition:transform .12s ease, background .15s ease, opacity .2s ease;}
.icon-btn:active{transform:scale(.9); background:#1B2745;}
.icon-btn[disabled]{opacity:.35; pointer-events:none;}
.icon-btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round;}
.btn{font-weight:700; font-size:15px; border-radius:14px; border:1px solid var(--line);
  background:#182138; color:var(--text); padding:13px 20px; cursor:pointer;
  transition:transform .12s ease, filter .15s ease;}
.btn:active{transform:scale(.97);}
.btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px;}
.btn svg.fill{fill:currentColor; stroke:none;}
.btn.small{padding:9px 14px; font-size:13px; display:inline-flex; align-items:center; gap:8px;}
.btn.small svg{width:16px; height:16px;}
.btn.danger{border-color:rgba(255,100,124,.55); color:var(--red);}
.btn-primary{background:var(--green); color:#06281A; border-color:transparent; font-size:17px;
  box-shadow:0 8px 24px -10px rgba(53,230,161,.55), inset 0 1px 0 rgba(255,255,255,.28);}
.icon-btn:focus-visible,.btn:focus-visible,.mode-card:focus-visible,.swatch:focus-visible{
  outline:2px solid var(--blue); outline-offset:2px;}

/* ============================= STAGE ============================= */
#stage{flex:1; min-height:0; position:relative;}
#boardWrap{position:absolute; inset:8px 12px calc(12px + var(--sab)) 12px;}
#board{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

/* ============================= HOME ============================= */
.home-inner{min-height:100%; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:13px; width:100%; max-width:420px; margin:0 auto;
  padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 16px);}
.logo{display:block;}
.logo-fly{animation:floaty 2.6s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
.title{font-size:clamp(30px,9vw,38px); letter-spacing:.08em; font-weight:800; margin:0; line-height:1;}
.title span{color:var(--green);}
.tagline{color:var(--muted); font-size:13.5px; margin:0; text-align:center;}
.btn-play{display:flex; align-items:center; justify-content:center; gap:10px;
  width:min(100%,280px); padding:15px 30px; border-radius:16px;}
#demo{width:min(56vw,200px); height:min(56vw,200px); display:block;}
#demoCaption{min-height:19px; font-size:13px; color:var(--muted); text-align:center;}
.mode-cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%;}
.mode-card{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--text); cursor:pointer; transition:transform .12s ease, background .15s ease;}
.mode-card:active{transform:scale(.96); background:#1B2745;}
.mode-card svg{width:20px; height:20px; stroke:var(--blue); fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round;}
.mode-card.rush svg{stroke:var(--amber);}
.mode-card b{font-size:14px;}
.mode-card .st{font-size:11px; color:var(--muted); text-align:center; line-height:1.3;}
.palette-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.pal-lbl{font-size:10px; color:var(--muted); letter-spacing:.14em; font-weight:700;}
#swatches{display:flex; gap:8px;}
.swatch{width:40px; height:30px; border-radius:9px; border:1px solid var(--line);
  background:#182138; display:flex; align-items:center; justify-content:center; gap:3px;
  cursor:pointer; position:relative; padding:0;}
.swatch:active{transform:scale(.93);}
.swatch .dot{width:7px; height:14px; border-radius:3px;}
.swatch.sel{border-color:var(--green); box-shadow:0 0 0 1px var(--green);}
.swatch.locked{opacity:.4;}
.swatch.locked::after{content:attr(data-lv); position:absolute; left:50%; transform:translateX(-50%);
  bottom:-14px; font-size:9px; color:var(--muted); font-weight:700;}
.home-meta{font-size:13px; color:var(--muted); text-align:center;}
.home-foot{display:flex; gap:10px; align-items:center;}
#soundBtnHome[aria-pressed="true"] .ic-off{display:none;}
#soundBtnHome[aria-pressed="false"] .ic-on{display:none;}

/* ============================= OVERLAYS ============================= */
.overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(7,11,22,.74); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:20; padding:20px;}
.overlay.open{opacity:1; pointer-events:auto;}
.overlay .panel{background:var(--panel2); border:1px solid var(--line); border-radius:20px;
  padding:22px; width:min(92vw,340px); max-height:86vh; overflow-y:auto; touch-action:pan-y;
  display:flex; flex-direction:column; gap:10px;
  box-shadow:0 26px 60px -18px rgba(0,0,0,.65);
  transform:translateY(16px) scale(.97); transition:transform .26s cubic-bezier(.22,1,.36,1);}
.overlay.open .panel{transform:none;}
.overlay h2{margin:0 0 6px; font-size:21px; text-align:center;}
.overlay-text{margin:0 0 8px; text-align:center; color:var(--muted); font-size:14px; line-height:1.45;}
.stats{display:flex; justify-content:center; background:#101A30; border:1px solid var(--line);
  border-radius:14px; padding:12px 4px;}
.stat{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0;}
.stat + .stat{border-left:1px solid var(--line);}
.stat b{font-size:19px; font-variant-numeric:tabular-nums;}
.stat span{font-size:10px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase;}
.next-line{margin:2px 0 4px; text-align:center; color:var(--muted); font-size:13px; line-height:1.4;}
.stars{display:flex; gap:8px; justify-content:center; margin:2px 0 0;}
.star{width:30px; height:30px;}
.star path{fill:none; stroke:#3A4A6B; stroke-width:1.6; stroke-linejoin:round;}
.star.on path{fill:var(--amber); stroke:var(--amber);}
.star.pop{animation:starPop .45s cubic-bezier(.34,1.56,.64,1) backwards;}
.stars .star:nth-child(2).pop{animation-delay:.12s;}
.stars .star:nth-child(3).pop{animation-delay:.24s;}
@keyframes starPop{from{transform:scale(0) rotate(-30deg);}}

/* ============================= TOAST ============================= */
#toast{position:fixed; left:50%; bottom:calc(26px + var(--sab)); transform:translate(-50%,10px);
  background:#1A2440; border:1px solid var(--line); color:var(--text); padding:9px 16px;
  border-radius:99px; font-size:13px; opacity:0; transition:opacity .25s ease, transform .25s ease;
  pointer-events:none; z-index:30; max-width:86vw; text-align:center;}
#toast.show{opacity:1; transform:translate(-50%,0);}

/* ============================= COMPACT / LANDSCAPE ============================= */
@media (max-height:480px){
  #hud{padding:6px 8px 4px; gap:8px;}
  .icon-btn{width:36px; height:36px; border-radius:10px;}
  .level-chip{min-width:50px; padding:4px 8px;}
  .level-chip .num{font-size:15px;}
  .count{display:none;}
  #boardWrap{inset:4px 8px calc(8px + var(--sab)) 8px;}
}
@media (max-width:359px){
  .icon-btn{width:36px; height:36px;}
  .level-chip{min-width:48px; padding:4px 7px;}
  #hud{gap:6px; padding:8px 8px 4px;}
  .mode-cards{gap:8px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important; animation-duration:.01ms!important;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= GAME SCREEN ================= -->
  <section id="game" class="screen hidden" aria-label="Arrow47 game">
    <header id="hud">
      <div class="level-chip">
        <span class="lbl" id="modeLbl">LEVEL</span><span class="num" id="levelNum">1</span>
      </div>
      <div class="hud-mid">
        <div class="progress" id="progressWrap" role="progressbar" aria-label="Level progress">
          <div id="progressFill"></div>
        </div>
        <span class="count" id="hudCount">— arrows left</span>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="undoBtn" aria-label="Undo last move" title="Undo (U)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h10a6 6 0 0 1 0 12H8"/></svg>
        </button>
        <button class="icon-btn" id="hintBtn" aria-label="Show hint" title="Hint (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1.5 1.4 1.5 2.5h5c0-1.1.7-1.8 1.5-2.5A6 6 0 0 0 12 3Z"/></svg>
        </button>
        <button class="icon-btn" id="restartBtn" aria-label="Restart" title="Restart (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="pauseBtn" aria-label="Pause" title="Pause (P)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        </button>
      </div>
    </header>
    <main id="stage">
      <div id="boardWrap"><canvas id="board"></canvas></div>
    </main>
  </section>

  <!-- ================= HOME SCREEN ================= -->
  <section id="home" class="screen" aria-label="Arrow47 home">
    <div class="home-inner">
      <svg class="logo" viewBox="0 0 96 96" width="70" height="70" aria-hidden="true">
        <rect x="4" y="22" width="60" height="60" rx="14" fill="#121A2D" stroke="rgba(255,255,255,.1)"/>
        <g transform="translate(22,44)"><path d="M-8 -3H0V-6L8 0 0 6V3H-8Z" fill="#55B8FF" stroke="#55B8FF" stroke-width="2" stroke-linejoin="round"/></g>
        <g transform="translate(46,62) rotate(90)"><path d="M-8 -3H0V-6L8 0 0 6V3H-8Z" fill="#FFC94D" stroke="#FFC94D" stroke-width="2" stroke-linejoin="round"/></g>
        <g transform="translate(22,64) rotate(-90)"><path d="M-8 -3H0V-6L8 0 0 6V3H-8Z" fill="#B48CFF" stroke="#B48CFF" stroke-width="2" stroke-linejoin="round"/></g>
        <g transform="translate(76,16) rotate(-45)"><g class="logo-fly">
          <path d="M-13 -5h4M-18 -2h5M-21 1.5h4" stroke="#35E6A1" stroke-width="2" stroke-linecap="round" opacity=".55"/>
          <path d="M-6 -3.5H0V-6.5L9 0 0 6.5V3.5H-6Z" fill="#35E6A1" stroke="#35E6A1" stroke-width="2" stroke-linejoin="round"/>
        </g></g>
      </svg>
      <h1 class="title">ARROW<span>47</span></h1>
      <p class="tagline">Free every arrow. One tap at a time.</p>
      <button class="btn btn-primary btn-play" id="playBtn">
        <svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M7 4.5v15l13-7.5Z"/></svg>
        <span id="playLabel">Play</span>
      </button>
      <canvas id="demo" aria-hidden="true"></canvas>
      <div id="demoCaption"></div>
      <div class="mode-cards">
        <button class="mode-card" id="dailyBtn" aria-label="Daily challenge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
          <b>Daily</b>
          <span class="st" id="dailyStatus">New puzzle ready</span>
        </button>
        <button class="mode-card rush" id="rushBtn" aria-label="Rush mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 13h5l-1 9 8-11h-5Z"/></svg>
          <b>Rush</b>
          <span class="st" id="rushStatus">75-second sprint</span>
        </button>
      </div>
      <div class="palette-row">
        <span class="pal-lbl">ARROWS</span>
        <div id="swatches" role="group" aria-label="Arrow color palette"></div>
      </div>
      <div class="home-foot">
        <button class="btn small sound-only" id="soundBtnHome" aria-pressed="true" aria-label="Toggle sound">
          <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3.5v6h3L11 19Z"/><path d="M15 9a4.5 4.5 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11"/></svg>
          <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3.5v6h3L11 19Z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          <span>Sound</span>
        </button>
        <button class="btn small" id="resetBtn">Reset progress</button>
      </div>
      <div class="home-meta" id="homeMeta"></div>
    </div>
  </section>

  <!-- ================= OVERLAYS ================= -->
  <div class="overlay" id="ovPause" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
    <div class="panel">
      <h2 id="pTitle">Paused</h2>
      <button class="btn btn-primary" id="resumeBtn">Resume</button>
      <button class="btn" id="pauseRestartBtn">Restart level</button>
      <button class="btn sound-only" id="pauseSoundBtn">Sound: On</button>
      <button class="btn" id="pauseHomeBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>
        Back to home
      </button>
    </div>
  </div>

  <div class="overlay" id="ovComplete" role="dialog" aria-modal="true" aria-labelledby="cTitle" hidden>
    <div class="panel">
      <div class="stars" id="starsRow" role="img" aria-label="Stars earned">
        <svg class="star" id="star1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6L12 16.8 6.6 19.6l1.1-6L3.2 9.4l6.1-.8Z"/></svg>
        <svg class="star" id="star2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6L12 16.8 6.6 19.6l1.1-6L3.2 9.4l6.1-.8Z"/></svg>
        <svg class="star" id="star3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6L12 16.8 6.6 19.6l1.1-6L3.2 9.4l6.1-.8Z"/></svg>
      </div>
      <h2 id="cTitle">Level clear</h2>
      <div class="stats">
        <div class="stat"><b id="stArrows">0</b><span>Arrows</span></div>
        <div class="stat"><b id="stMoves">0</b><span>Moves</span></div>
        <div class="stat"><b id="stHints">0</b><span>Hints</span></div>
        <div class="stat"><b id="stBlocked">0</b><span>Blocked</span></div>
      </div>
      <p class="next-line" id="cSub"></p>
      <p class="next-line" id="nextLine"></p>
      <button class="btn btn-primary" id="continueBtn">
        Continue
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
      <button class="btn" id="replayBtn">Replay level</button>
    </div>
  </div>

  <div class="overlay" id="ovStuck" role="dialog" aria-modal="true" aria-labelledby="stTitle" hidden>
    <div class="panel">
      <h2 id="stTitle">Boxed in</h2>
      <p class="overlay-text">No arrow can escape right now — every path is blocked.</p>
      <button class="btn btn-primary" id="stuckUndoBtn">Undo last move</button>
      <button class="btn" id="stuckRestartBtn">Restart level</button>
    </div>
  </div>

  <div class="overlay" id="ovResults" role="dialog" aria-modal="true" aria-labelledby="rTitle" hidden>
    <div class="panel">
      <h2 id="rTitle">Time's up</h2>
      <div class="stats">
        <div class="stat"><b id="stScore">0</b><span>Score</span></div>
        <div class="stat"><b id="stBoards">0</b><span>Boards</span></div>
        <div class="stat"><b id="stCombo">×0</b><span>Best combo</span></div>
      </div>
      <p class="next-line" id="resLine"></p>
      <button class="btn btn-primary" id="againBtn">Play again</button>
      <button class="btn" id="resHomeBtn">Home</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
/* =====================================================================
   Arrow47 v2 — architecture map
   Platform       YouTube Playables adapter (official SDK, feature-detected;
                   cloud load-before-save queue, host audio, pause/resume,
                   optional sendScore). Safe browser fallback, no fake SDK.
   Storage        localStorage — STANDALONE BROWSER FALLBACK ONLY. Never used
                   for persistent progress while running inside Playables.
   AudioMgr       lazy Web Audio synth; gated by host audio state in Playables
   Generator      reverse-construction generation + metric analyzer
                   (initial openings, average branching) + anti-repetition
                   signatures. Every board is solvable by construction and
                   re-verified by simulation.
   solveSession   bounded DFS solver used for safe hints (game-state only)
   Session        authoritative game state (grid space, no pixels)
   Renderer       Canvas 2D drawing; never decides move validity
   Demo           scripted home-screen teaching loop
   Rush           time-attack controller (75s + board bonuses)
   UI / App       DOM wiring, screens, overlays, modes, tutorial, flow
   ===================================================================== */

/* ---------------------- constants & helpers ---------------------- */
const DIRS=[
  {dx: 1,dy: 0},{dx: 1,dy: 1},{dx: 0,dy: 1},{dx:-1,dy: 1},
  {dx:-1,dy: 0},{dx:-1,dy:-1},{dx: 0,dy:-1},{dx: 1,dy:-1}
];
for(const d of DIRS) d.ang=Math.atan2(d.dy,d.dx);
const ORTH=[0,2,4,6], DIAG=[1,3,5,7];

const PALETTES=[
  {name:'Classic',unlock:1, colors:['#55B8FF','#35E6A1','#FFC94D','#B48CFF','#FF9E7D']},
  {name:'Ember',  unlock:10,colors:['#FF6B6B','#FFD166','#4ECDC4','#C77DFF','#FFA94D']},
  {name:'Neon',   unlock:25,colors:['#00F5D4','#00BBF9','#F15BB5','#FEE440','#9B5DE5']},
  {name:'Aurora', unlock:50,colors:['#60A5FA','#22D3EE','#A78BFA','#2DD4BF','#F0ABFC']}
];

const RUSH_START=75000, RUSH_CAP=90000, RUSH_BONUS=10000, RUSH_HINT_PENALTY=5000;

const REDUCED=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||false;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOutBack=k=>{const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};

function mulberry32(seed){ // deterministic RNG — same seed, same board
  let a=seed>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function hashSeed(runSeed,level){
  let h=(runSeed>>>0)^Math.imul(level|0,0x9E3779B1);
  h=Math.imul(h^(h>>>16),0x85EBCA6B); h^=h>>>13;
  return h>>>0;
}
function strHash(s){ // FNV-1a — deterministic daily puzzle seed
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function dailyKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function stepsToEdge(cell,dir,cols,rows){
  const {dx,dy}=DIRS[dir];
  const x=cell%cols, y=(cell/cols)|0;
  const sx=dx>0?cols-x:dx<0?x+1:Infinity;
  const sy=dy>0?rows-y:dy<0?y+1:Infinity;
  return Math.min(sx,sy);
}
function pathClearFrom(x,y,dir,occ,cols,rows){
  const {dx,dy}=DIRS[dir];
  let cx=x+dx, cy=y+dy;
  while(cx>=0&&cx<cols&&cy>=0&&cy<rows){
    if(occ[cy*cols+cx]) return false;
    cx+=dx; cy+=dy;
  }
  return true;
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
/* The single arrow shape used everywhere: a fat rounded arrow pointing +x. */
function drawArrow(ctx,x,y,ang,cell,color,alpha,scale){
  alpha=alpha==null?1:alpha; scale=scale==null?1:scale;
  const c=cell, aW=0.15*c, bW=0.30*c, xTip=0.35*c, xHead=0.07*c, xBack=-0.33*c;
  const path=()=>{
    ctx.beginPath();
    ctx.moveTo(xBack,-aW); ctx.lineTo(xHead,-aW); ctx.lineTo(xHead,-bW); ctx.lineTo(xTip,0);
    ctx.lineTo(xHead,bW); ctx.lineTo(xHead,aW); ctx.lineTo(xBack,aW); ctx.closePath();
  };
  ctx.save();
  ctx.translate(x,y); ctx.rotate(ang); ctx.scale(scale,scale); ctx.globalAlpha=alpha;
  ctx.lineJoin='round'; ctx.lineWidth=0.10*c;
  ctx.save(); ctx.translate(0,0.07*c); path();
  ctx.strokeStyle='rgba(3,7,16,.5)'; ctx.fillStyle='rgba(3,7,16,.5)'; ctx.stroke(); ctx.fill();
  ctx.restore();
  path(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.stroke(); ctx.fill();
  ctx.restore();
}

const Storage={
  KEY:'arrow47.save.v2', mem:null,
  read(){

/* ---------------------- audio (synthesized, gesture-gated) ---------------------- */
const AudioMgr=(()=>{
  let ctx=null, master=null, enabled=true;
  function ensure(){
    if(ctx||!enabled) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=0.4; master.connect(ctx.destination);
    }catch(e){ ctx=null; }
  }
  function tone(o){
    if(!ctx) return;
    try{
      const t0=ctx.currentTime+(o.delay||0);
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type=o.type||'sine';
      osc.frequency.setValueAtTime(o.freq,t0);
      if(o.end&&o.end!==o.freq) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.end),t0+o.dur);
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(o.vol||0.15,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0+o.dur+0.05);
    }catch(e){}
  }
  const SFX={
    escape(){ tone({freq:300,end:920,type:'sine',dur:0.16,vol:0.22});
              tone({freq:600,end:1840,type:'sine',dur:0.16,vol:0.06}); },
    blocked(){ tone({freq:170,end:110,type:'square',dur:0.12,vol:0.10}); },
    hint(){ tone({freq:740,dur:0.09,vol:0.11}); tone({freq:1108,dur:0.12,vol:0.09,delay:0.09}); },
    undo(){ tone({freq:620,end:330,type:'triangle',dur:0.12,vol:0.13}); },
    complete(){ [523,659,784,1046].forEach((f,i)=>tone({freq:f,type:'triangle',dur:0.16,vol:0.15,delay:i*0.09})); },
    click(){ tone({freq:520,end:640,type:'triangle',dur:0.06,vol:0.10}); }
  };
  return {
    get enabled(){return enabled;},
    setEnabled(v){ enabled=!!v; if(enabled) this.resumeCtx(); },
    unlock(){ ensure(); this.resumeCtx(); },   // user gestures only
    suspend(){ try{ if(ctx&&ctx.state==='running') ctx.suspend(); }catch(e){} },
    resumeCtx(){ try{ if(ctx&&ctx.state==='suspended') ctx.resume(); }catch(e){} },
    play(name){
      if(!enabled) return;
      if(Platform.mode==='playables'&&!App.hostAudio) return; // host owns audio
      ensure(); if(!ctx) return; if(SFX[name]) SFX[name]();
    }
  };
})();

/* ---------------------- YouTube Playables adapter ----------------------
   Official SDK (https://developers.google.com/youtube/gaming/playables):
   the script is injected only when running inside a host context (iframe /
   YouTube host), so standalone and offline browsers never fetch it and never
   depend on it. Every call is feature-detected and wrapped — nothing is
   faked and no errors leak when APIs are absent. Method names follow the
   official docs (firstFrameReady / gameReady / loadGame / saveGame /
   onPause / onResume / getAudioState / gameplayStart / gameplayStop /
   sendScore); re-verify signatures against current docs at submission.  */
const Platform=(()=>{
  const SDK_URL='https://www.youtube.com/game_api/v1';
  let sdk=null, mode='browser', ready=false, readyCb=null;
  let cloudLoaded=false, pendingSave=null;

  function settle(m){ if(ready) return; mode=m; ready=true; if(readyCb) readyCb(m); }
  function inHost(){
    try{ if(window.top!==window.self) return true; }catch(e){ return true; }
    return /(^|\.)(youtube(-nocookie)?\.com|ytimg\.com)$/.test(location.hostname||'');
  }
  function call(name){
    if(!sdk) return false;
    try{
      if(typeof sdk[name]==='function'){
        if(arguments.length>1) sdk[name](arguments[1]);
        else sdk[name]();
        return true;
      }
    }catch(e){}
    return false;
  }
  function flush(){ // cloud saves only after loadGame has completed
    if(pendingSave===null||!cloudLoaded||mode!=='playables') return;
    call('saveGame',pendingSave);
    pendingSave=null;
  }
  return {
    get mode(){return mode;}, get ready(){return ready;},
    init(cb){
      readyCb=cb;
      const host=inHost();
      if(window.YTPlayables&&host){ sdk=window.YTPlayables; settle('playables'); return; }
      if(!host){ settle('browser'); return; } // standalone: no fetch, no SDK
      // Host context: load the official SDK, then wait (bounded) for it.
      const s=document.createElement('script');
      s.src=SDK_URL; s.async=true;
      document.head.appendChild(s);
      let tries=0;
      const iv=setInterval(()=>{
        if(window.YTPlayables){ sdk=window.YTPlayables; clearInterval(iv); settle('playables'); }
        else if(++tries>=20){ clearInterval(iv); settle('browser'); }
      },100);
    },
    firstFrameReady(){ call('firstFrameReady'); },
    gameReady(){ call('gameReady'); },
    gameplayStart(){ call('gameplayStart'); },
    gameplayStop(){ call('gameplayStop'); },
    loadCloud(cb){ // must resolve before any saveGame call
      if(mode!=='playables'){ cloudLoaded=true; cb(null); return; }
      let answered=false;
      try{
        if(sdk&&typeof sdk.loadGame==='function'){
          sdk.loadGame(data=>{
            answered=true; cloudLoaded=true; flush();
            let parsed=null;
            try{ parsed=(typeof data==='string'&&data)?JSON.parse(data):(data||null); }catch(e){}
            cb(parsed);
          });
          setTimeout(()=>{ if(!answered){ answered=true; cloudLoaded=true; flush(); cb(null); } },2000);
          return;
        }
      }catch(e){}
      cloudLoaded=true; cb(null);
    },
    save(json,obj){
      if(mode==='browser'){ Storage.write(obj); return; } // standalone fallback only
      pendingSave=json;         // latest-only queue, bounded
      flush();
    },
    sendScore(n){ call('sendScore',n|0); }, // optional score reporting, guarded
    audioOn(){
      try{
        if(mode==='playables'&&sdk&&typeof sdk.getAudioState==='function'){
          const st=sdk.getAudioState();
          if(typeof st==='string') return st!=='off'&&st!=='muted';
          if(st&&typeof st==='object'){
            if(typeof st.muted==='boolean') return !st.muted;
            if(typeof st.audio==='boolean') return st.audio;
            if(typeof st.audioOn==='boolean') return st.audioOn;
          }
        }
      }catch(e){}
      return true;
    },
    bindLifecycle(h){
      if(mode==='playables'){ call('onPause',h.onPause); call('onResume',h.onResume); }
      document.addEventListener('visibilitychange',()=>{ document.hidden?h.onPause():h.onResume(); });
    }
  };
})();

/* ---------------------- puzzle generator ----------------------
   Reverse construction: each arrow is placed only where its path to the
   boundary is clear of all previously placed arrows, so removing them in
   reverse placement order is a guaranteed solution (verify() re-checks it
   by simulation). analyze() measures structural difficulty (openings and
   branching) so levels progress smoothly instead of spiking. */
const Generator={
  levelParams(level){
    const s=level-1;
    const cols=Math.min(4+Math.floor(s/8),7);
    const rows=Math.min(cols+1+Math.floor(s/24),10);
    const density=Math.min(0.34+s*0.0085,0.55);
    const target=Math.min(Math.round(cols*rows*density),28);
    const pDiag=level<10?0:Math.min((s-9)*0.025,0.4);
    return {cols,rows,target,pDiag};
  },
  targets(level){ // desired difficulty band: openings & branching shrink slowly
    if(level<=3) return {init:3.4, avg:4.2};
    const s=level-4;
    return {init:Math.max(1.7,3.3-s*0.05), avg:Math.max(2.0,4.4-s*0.055)};
  },
  analyze(b){ // openings at start + branching along the recorded solution
    const {cols,rows,arrows}=b, n=arrows.length;
    const occ=new Uint8Array(cols*rows);
    for(const a of arrows) occ[a.cell]=1;
    const order=arrows.slice().reverse(); // removal order
    const isClear=a=>pathClearFrom(a.cell%cols,(a.cell/cols)|0,a.dir,occ,cols,rows);
    let initial=0, sum=0, min=Infinity;
    for(let i=0;i<n;i++){
      let cnt=0;
      for(let j=i;j<n;j++) if(isClear(order[j])) cnt++;
      if(i===0) initial=cnt;
      if(cnt<min) min=cnt;
      sum+=cnt;
      occ[order[i].cell]=0;
    }
    return {initial, avg:n?sum/n:0, min};
  },
  sig(b,m){ // structural signature for anti-repetition
    const h=new Array(8).fill(0);
    for(const a of b.arrows) h[a.dir]++;
    return b.cols+'x'+b.rows+':'+b.arrows.length+':'+h.join('')+':'+m.initial;
  },
  build(p,rng){
    const {cols,rows}=p, n=cols*rows;
    const occ=new Uint8Array(n), arrows=[];
    const cells=Array.from({length:n},(_,i)=>i);
    for(let i=n-1;i>0;i--){ const j=(rng()*(i+1))|0; const t=cells[i]; cells[i]=cells[j]; cells[j]=t; }
    for(const ci of cells){
      if(arrows.length>=p.target) break;
      const x=ci%cols, y=(ci/cols)|0;
      const dirs=(rng()<p.pDiag?DIAG:ORTH).slice();
      for(let i=dirs.length-1;i>0;i--){ const j=(rng()*(i+1))|0; const t=dirs[i]; dirs[i]=dirs[j]; dirs[j]=t; }
      for(const d of dirs){
        if(pathClearFrom(x,y,d,occ,cols,rows)){
          occ[ci]=1;
          arrows.push({cell:ci,dir:d,color:(rng()*PALETTES[0].colors.length)|0});
          break;
        }
      }
    }
    return {cols,rows,arrows};
  },
  verify(b){ // simulate the recorded solution; must clear the board
    const {cols,rows,arrows}=b;
    const occ=new Uint8Array(cols*rows);
    for(const a of arrows) occ[a.cell]=1;
    for(let i=arrows.length-1;i>=0;i--){
      const a=arrows[i];
      if(!pathClearFrom(a.cell%cols,(a.cell/cols)|0,a.dir,occ,cols,rows)) return false;
      occ[a.cell]=0;
    }
    return true;
  },
  finish(b,level,seed){
    b.arrows.forEach((a,i)=>{a.id=i;});
    b.level=level; b.seed=seed>>>0;
    b.solution=b.arrows.map((_,i)=>i).reverse();
    if(!b.metrics) b.metrics=this.analyze(b);
    return b;
  },
  generate(level,seed,opts){
    opts=opts||{};
    seed=seed>>>0;
    const p=this.levelParams(level), t=this.targets(level);
    const K=level<=3?12:8; // bounded retries, deterministic per seed
    let best=null, bestFit=Infinity, fb=null;
    for(let i=0;i<K;i++){
      const b=this.build(p,mulberry32((seed+Math.imul(i+1,0x9E3779B1))>>>0));
      if(!b.arrows.length||!this.verify(b)) continue;
      if(!fb) fb=b; // any verified board guarantees termination
      const m=this.analyze(b); b.metrics=m;
      if(level<=3&&m.initial<3) continue; // early levels: several openings
      if(level<=8&&m.initial<2) continue;
      const fit=Math.abs(m.initial-t.init)+0.7*Math.abs(m.avg-t.avg)
              +((opts.recent&&opts.recent.indexOf(this.sig(b,m))>=0)?1.5:0);
      if(fit<bestFit){ bestFit=fit; best=b; }
      if(fit<=0.6) break; // close enough to target — stop early
    }
    let chosen=best||fb;
    if(!chosen){ // emergency fallback (unreachable in practice): always solvable
      const cols=Math.max(3,p.cols), k=Math.min(4,cols), arrows=[];
      for(let i=0;i<k;i++) arrows.push({cell:i,dir:0,color:i%5});
      return this.finish({cols,rows:Math.max(4,p.rows),arrows},level,seed);
    }
    return this.finish(chosen,level,seed);
  }
};

/* ---------------------- bounded DFS solver (safe hints) ---------------------- */
function solveSession(session,budget){
  budget=budget||6000;
  const {cols,rows}=session;
  const arrows=session.arrows.filter(a=>a.alive);
  const n=arrows.length;
  if(n===0) return {solved:true,seq:[],timeout:false};
  const occ=new Uint8Array(cols*rows);
  for(const a of arrows) occ[a.cell]=1;
  const items=arrows.map(a=>({a,len:stepsToEdge(a.cell,a.dir,cols,rows)}))
                    .sort((p,q)=>p.len-q.len);
  const removed=new Uint8Array(n), seq=[];
  let nodes=0, timeout=false;
  function clearPath(a){
    const {dx,dy}=DIRS[a.dir];
    let cx=a.cell%cols+dx, cy=((a.cell/cols)|0)+dy;
    while(cx>=0&&cx<cols&&cy>=0&&cy<rows){ if(occ[cy*cols+cx]) return false; cx+=dx; cy+=dy; }
    return true;
  }
  function dfs(remaining){
    if(remaining===0) return true;
    if(++nodes>budget){ timeout=true; return false; }
    for(let i=0;i<n;i++){
      if(removed[i]) continue;
      const a=items[i].a;
      if(!clearPath(a)) continue;
      removed[i]=1; occ[a.cell]=0; seq.push(a.id);
      if(dfs(remaining-1)) return true;
      seq.pop(); occ[a.cell]=1; removed[i]=0;
      if(timeout) return false;
    }
    return false;
  }
  const solved=dfs(n);
  return {solved,seq:solved?seq.slice():[],timeout};
}

/* ---------------------- authoritative game state ---------------------- */
class Session{
  constructor(board,mode){
    this.mode=mode;
    this.level=board.level;
    this.cols=board.cols; this.rows=board.rows;
    this.arrows=board.arrows.map(a=>({id:a.id,cell:a.cell,dir:a.dir,color:a.color,alive:true}));
    this.occ=new Uint8Array(this.cols*this.rows);
    for(const a of this.arrows) this.occ[a.cell]=1;
    this.total=this.arrows.length; this.alive=this.total;
    this.moves=0; this.hints=0; this.failed=0;
    this.combo=0; this.comboBest=0; this.score=0; this.stars=0;
    this.undoStack=[]; this.completed=false;
  }
  findAlive(ci){
    for(const a of this.arrows){ if(a.alive&&a.cell===ci) return a; }
    return null;
  }
  pathInfo(a){
    const {dx,dy}=DIRS[a.dir], cells=[], blockers=[];
    let cx=a.cell%this.cols+dx, cy=((a.cell/this.cols)|0)+dy;
    while(cx>=0&&cx<this.cols&&cy>=0&&cy<this.rows){
      const ci=cy*this.cols+cx; cells.push(ci);
      const b=this.findAlive(ci); if(b) blockers.push(b);
      cx+=dx; cy+=dy;
    }
    return {clear:blockers.length===0,cells,blockers};
  }
  escapable(){
    const r=[];
    for(const a of this.arrows){ if(a.alive&&this.pathInfo(a).clear) r.push(a); }
    return r;
  }
  tap(a){ // returns {ok, pts, combo, info}; pushes a full stat snapshot for undo
    const info=this.pathInfo(a);
    this.undoStack.push({id:info.clear?a.id:null,moves:this.moves,failed:this.failed,
                         combo:this.combo,score:this.score,comboBest:this.comboBest});
    this.moves++;
    if(info.clear){
      this.combo++; this.comboBest=Math.max(this.comboBest,this.combo);
      let pts=0;
      if(this.mode==='rush'){ pts=10+5*Math.min(this.combo-1,5); this.score+=pts; }
      a.alive=false; this.occ[a.cell]=0; this.alive--;
      return {ok:true,pts,combo:this.combo,info};
    }
    this.failed++; this.combo=0;
    return {ok:false,pts:0,combo:0,info};
  }
  undo(){ // restores the arrow AND all stats to the exact prior state
    while(this.undoStack.length){
      const s=this.undoStack.pop();
      if(s.id!=null){
        const a=this.arrows[s.id];
        if(a&&!a.alive){ a.alive=true; this.occ[a.cell]=1; this.alive++; }
      }
      this.moves=s.moves; this.failed=s.failed; this.combo=s.combo;
      this.score=s.score; this.comboBest=s.comboBest;
      return s.id;
    }
    return undefined;
  }
}

/* ---------------------- canvas renderer ---------------------- */
class Renderer{
  constructor(canvas,wrap){
    this.canvas=canvas; this.ctx=canvas.getContext('2d'); this.wrap=wrap;
    this.dpr=1; this.w=0; this.h=0; this.cell=0; this.bx=0; this.by=0;
    this.bw=0; this.bh=0; this.pad=10; this.lastT=0;
  }
  resize(){
    const r=this.wrap.getBoundingClientRect();
    if(r.width<4||r.height<4) return;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    this.dpr=dpr; this.w=r.width; this.h=r.height;
    this.canvas.width=Math.round(r.width*dpr);
    this.canvas.height=Math.round(r.height*dpr);
    this.measure();
    App.dirty=true;
  }
  measure(){
    const s=App.session;
    if(!s){ this.cell=0; return; }
    const padX=Math.max(10,this.w*0.02), padY=Math.max(10,this.h*0.02), inner=this.pad;
    const cell=Math.min(
      Math.floor((this.w-padX*2-inner*2)/s.cols),
      Math.floor((this.h-padY*2-inner*2)/s.rows), 96);
    this.cell=Math.max(12,cell);
    this.bw=this.cell*s.cols; this.bh=this.cell*s.rows;
    this.bx=Math.round((this.w-this.bw)/2);
    this.by=Math.round((this.h-this.bh)/2);
  }
  cellCenter(ci){
    const s=App.session;
    return {x:this.bx+((ci%s.cols)+0.5)*this.cell, y:this.by+(((ci/s.cols)|0)+0.5)*this.cell};
  }
  render(now){
    const ctx=this.ctx, s=App.session, fx=App.fx;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,this.w,this.h);
    if(!s){ this.lastT=now; return; }
    const c=this.cell, cr=Math.max(3,c*0.14), cols=ACOLORS();
    let pulse=1;
    if(fx.boardPulse){
      const k=clamp((now-fx.boardPulse)/520,0,1);
      pulse=1+Math.sin(Math.PI*k)*0.02;
    }
    ctx.save();
    if(pulse!==1){ ctx.translate(this.w/2,this.h/2); ctx.scale(pulse,pulse); ctx.translate(-this.w/2,-this.h/2); }

    /* board panel + cell tiles */
    roundRect(ctx,this.bx-this.pad,this.by-this.pad,this.bw+this.pad*2,this.bh+this.pad*2,18);
    ctx.fillStyle='#121A2D'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1; ctx.stroke();
    for(let y=0;y<s.rows;y++)for(let x=0;x<s.cols;x++){
      roundRect(ctx,this.bx+x*c+2,this.by+y*c+2,c-4,c-4,cr);
      ctx.fillStyle='rgba(255,255,255,.026)'; ctx.fill();
    }

    /* blocked-path flashes (red tint + blocker outlines) */
    for(const f of fx.flashes){
      const k=clamp((now-f.t0)/480,0,1), a=1-k;
      if(a<=0) continue;
      for(const ci of f.cells){
        const x=this.bx+(ci%s.cols)*c, y=this.by+((ci/s.cols)|0)*c;
        roundRect(ctx,x+2,y+2,c-4,c-4,cr);
        ctx.fillStyle='rgba(255,100,124,'+(a*0.20).toFixed(3)+')'; ctx.fill();
      }
      for(const b of f.blockers){
        if(!b.alive) continue;
        const p=this.cellCenter(b.cell);
        roundRect(ctx,p.x-c/2+2,p.y-c/2+2,c-4,c-4,cr);
        ctx.strokeStyle='rgba(255,100,124,'+(a*0.85).toFixed(3)+')';
        ctx.lineWidth=3; ctx.stroke();
      }
    }

    /* hint / tutorial highlight */
    if(fx.hint){
      const h=fx.hint;
      if(now-h.t0>=h.dur||!h.arrow.alive){ fx.hint=null; }
      else{
        const col=h.color||'#35E6A1';
        if(h.showPath){
          const a=0.10+0.05*Math.sin((now-h.t0)/170);
          for(const ci of h.cells){
            const x=this.bx+(ci%s.cols)*c, y=this.by+((ci/s.cols)|0)*c;
            roundRect(ctx,x+2,y+2,c-4,c-4,cr);
            ctx.fillStyle='rgba(53,230,161,'+a.toFixed(3)+')'; ctx.fill();
          }
        }
        const p=this.cellCenter(h.arrow.cell);
        ctx.beginPath();
        ctx.arc(p.x,p.y,c*0.62+Math.sin(now/170)*2.5,0,Math.PI*2);
        ctx.strokeStyle=col; ctx.globalAlpha=.95; ctx.lineWidth=3; ctx.stroke();
        ctx.globalAlpha=1;
        if(h.showPath){
          const steps=stepsToEdge(h.arrow.cell,h.arrow.dir,s.cols,s.rows);
          const {dx,dy}=DIRS[h.arrow.dir];
          ctx.save();
          ctx.strokeStyle='rgba(53,230,161,.85)'; ctx.lineWidth=2.5;
          ctx.setLineDash([7,7]); ctx.lineDashOffset=-((now/30)%14);
          ctx.beginPath();
          ctx.moveTo(p.x+dx*c*0.5,p.y+dy*c*0.5);
          ctx.lineTo(p.x+dx*steps*c,p.y+dy*steps*c);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    /* arrows */
    for(const a of s.arrows){
      if(!a.alive) continue;
      let p=this.cellCenter(a.cell), x=p.x, y=p.y, scale=1, alpha=1, redOverlay=0;
      const rt=fx.restores.get(a.id);
      if(rt!==undefined){ // undo pop-in
        const k=clamp((now-rt)/420,0,1);
        if(k>=1) fx.restores.delete(a.id);
        else{ scale=lerp(0.25,1,easeOutBack(k)); alpha=clamp(k*2,0,1); }
      }
      const st=fx.shakes.get(a.id);
      if(st!==undefined){ // blocked shake, perpendicular to travel
        const k=clamp((now-st)/380,0,1);
        if(k>=1) fx.shakes.delete(a.id);
        else{
          const amp=Math.sin(k*Math.PI*6)*(1-k)*c*(REDUCED?0.03:0.10);
          x+=-DIRS[a.dir].dy*amp; y+=DIRS[a.dir].dx*amp;
          redOverlay=1-k;
        }
      }
      drawArrow(ctx,x,y,DIRS[a.dir].ang,c,cols[a.color],alpha,scale);
      if(redOverlay>0) drawArrow(ctx,x,y,DIRS[a.dir].ang,c,'#FF647C',redOverlay*0.5,scale);
    }

    /* keyboard cursor */
    if(fx.cursor&&now<fx.cursor.until){
      const x=this.bx+fx.cursor.x*c, y=this.by+fx.cursor.y*c;
      roundRect(ctx,x+2,y+2,c-4,c-4,cr);
      ctx.strokeStyle='rgba(85,184,255,'+(0.55+0.35*Math.sin(now/220)).toFixed(3)+')';
      ctx.lineWidth=2.5; ctx.stroke();
    }

    /* escaping arrows — pixel positions snapshotted at spawn, so board
       changes (next level / next rush board / resize) never misplace them */
    for(const fl of fx.fliers){
      const k=clamp((now-fl.t0)/fl.dur,0,1), e=k*k;
      const px=fl.x0+fl.dx*e*fl.travel, py=fl.y0+fl.dy*e*fl.travel;
      const alpha=k<0.6?1:1-(k-0.6)/0.4;
      if(!REDUCED){
        drawArrow(ctx,px-fl.dx*c*0.42,py-fl.dy*c*0.42,fl.ang,c,fl.color,alpha*0.22,0.9);
        drawArrow(ctx,px-fl.dx*c*0.8,py-fl.dy*c*0.8,fl.ang,c,fl.color,alpha*0.10,0.82);
      }
      drawArrow(ctx,px,py,fl.ang,c,fl.color,alpha,1);
    }

    /* exit-gate flashes */
    for(const ef of fx.edgeFlashes){
      if(now<ef.t0) continue;
      const k=clamp((now-ef.t0)/440,0,1);
      const half=(0.28+0.55*k)*c;
      ctx.save();
      ctx.globalAlpha=(1-k)*0.9;
      ctx.strokeStyle=ef.color; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(ef.x-ef.dy*half,ef.y-ef.dx*half);
      ctx.lineTo(ef.x+ef.dy*half,ef.y+ef.dx*half);
      ctx.stroke();
      ctx.restore();
    }

    /* particles (escape sparks + confetti) */
    if(fx.particles.length){
      const dt=Math.min(40,now-(this.lastT||now-16));
      for(const p of fx.particles){
        if(p.delay>0){ p.delay-=dt; continue; }
        p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot=(p.rot||0)+(p.vr||0)*dt;
      }
      for(const p of fx.particles){
        if(p.delay>0||p.life<=0) continue;
        ctx.save();
        ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
        ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
        ctx.fillStyle=p.color;
        if(p.shape===1){ ctx.fillRect(-p.size/2,-p.size*0.3,p.size,p.size*0.6); }
        else{ ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      }
      fx.particles=fx.particles.filter(p=>p.delay>0||p.life>0);
    }

    /* floating combo / score texts */
    for(const t of fx.texts){
      const k=clamp((now-t.t0)/800,0,1);
      if(k>=1) continue;
      ctx.save();
      ctx.globalAlpha=1-k;
      ctx.fillStyle=t.color;
      ctx.font='800 '+Math.round(c*0.42)+'px '+'Trebuchet MS,sans-serif';
      ctx.textAlign='center';
      ctx.fillText(t.str,t.x,t.y-k*c*0.8);
      ctx.restore();
    }
    fx.texts=fx.texts.filter(t=>now-t.t0<800);

    ctx.restore();

    /* prune finished fx */
    fx.fliers=fx.fliers.filter(f=>now-f.t0<f.dur);
    fx.flashes=fx.flashes.filter(f=>now-f.t0<480);
    fx.edgeFlashes=fx.edgeFlashes.filter(f=>now-f.t0<460);
    this.lastT=now;
  }
}

/* ---------------------- home-screen demo (scripted loop) ---------------------- */
const Demo={
  PERIOD:6600, t0:0, lastCap:'', dpr:1, size:0, cell:0, bx:0, by:0,
  init(){
    this.canvas=$('demo'); this.ctx=this.canvas.getContext('2d');
    this.t0=performance.now(); this.resize();
  },
  resize(){
    const w=this.canvas.clientWidth||160;
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.size=w;
    this.canvas.width=Math.round(w*this.dpr);
    this.canvas.height=Math.round(w*this.dpr);
    this.cell=Math.floor((w-26)/3);
    this.bx=Math.round((w-this.cell*3)/2); this.by=this.bx;
  },
  center(cell){
    return {x:this.bx+((cell%3)+0.5)*this.cell, y:this.by+(((cell/3)|0)+0.5)*this.cell};
  },
  render(now){
    const ctx=this.ctx, c=this.cell, t=(now-this.t0)%this.PERIOD;
    const cols=ACOLORS();
    const A={cell:3,dir:0,color:0}, B={cell:4,dir:2,color:1}, D={cell:2,dir:6,color:2};
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,this.size,this.size);
    const cr=Math.max(3,c*0.14);
    roundRect(ctx,this.bx-12,this.by-12,c*3+24,c*3+24,14);
    ctx.fillStyle='#121A2D'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1; ctx.stroke();
    for(let y=0;y<3;y++)for(let x=0;x<3;x++){
      roundRect(ctx,this.bx+x*c+2,this.by+y*c+2,c-4,c-4,cr);
      ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fill();
    }
    if(t>=900&&t<1400){ // blocked moment: tinted path cell
      const k=(t-900)/500, a=1-k, p=this.center(4);
      roundRect(ctx,p.x-c/2+2,p.y-c/2+2,c-4,c-4,cr);
      ctx.fillStyle='rgba(255,100,124,'+(a*0.20).toFixed(3)+')'; ctx.fill();
      if(t<2400){
        roundRect(ctx,p.x-c/2+2,p.y-c/2+2,c-4,c-4,cr);
        ctx.strokeStyle='rgba(255,100,124,'+(a*0.85).toFixed(3)+')';
        ctx.lineWidth=3; ctx.stroke();
      }
    }
    const ring=(cell,color,on)=>{
      if(!on) return;
      const p=this.center(cell);
      ctx.beginPath(); ctx.arc(p.x,p.y,c*0.62+Math.sin(now/170)*2.5,0,Math.PI*2);
      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.globalAlpha=.95; ctx.stroke(); ctx.globalAlpha=1;
    };
    ring(3,'#55B8FF',(t>260&&t<900)||(t>3150&&t<3900));
    ring(4,'#35E6A1',t>1650&&t<2400);
    ring(2,'#FFD166',t>4600&&t<5300);
    const drawStatic=(a,shake,tap)=>{
      let {x,y}=this.center(a.cell), sc=1, red=0;
      if(tap!==undefined){ const k=clamp((t-tap)/180,0,1); sc=lerp(0.85,1,easeOutBack(k)); }
      if(shake){
        const k=clamp((t-900)/420,0,1);
        const amp=Math.sin(k*Math.PI*6)*(1-k)*c*(REDUCED?0.03:0.09);
        x+=-DIRS[a.dir].dy*amp; y+=DIRS[a.dir].dx*amp; red=1-k;
      }
      drawArrow(ctx,x,y,DIRS[a.dir].ang,c,cols[a.color],1,sc);
      if(red>0) drawArrow(ctx,x,y,DIRS[a.dir].ang,c,'#FF647C',red*0.5,sc);
    };
    const drawFly=(a,tStart,dur)=>{
      const k=clamp((t-tStart)/dur,0,1); if(k>=1) return;
      const e=k*k, steps=stepsToEdge(a.cell,a.dir,3,3);
      const p=this.center(a.cell), {dx,dy,ang}=DIRS[a.dir];
      const d=e*(steps+1.5)*c, alpha=k<0.6?1:1-(k-0.6)/0.4;
      drawArrow(ctx,p.x+dx*d,p.y+dy*d,ang,c,cols[a.color],alpha,1);
    };
    const tap=t>=900&&t<1100?900:undefined, shake=t>=900&&t<1320;
    if(t<3900) drawStatic(A,shake,tap); else drawFly(A,3900,460);
    if(t<2400) drawStatic(B,false,undefined); else drawFly(B,2400,480);
    if(t<5300) drawStatic(D,false,undefined); else drawFly(D,5300,440);
    let cap;
    if(t<260) cap='Watch closely…';
    else if(t<1050) cap='Tap an arrow to launch it';
    else if(t<2400) cap='Blocked — another arrow is in its way';
    else if(t<3150) cap='The blocker escapes first';
    else if(t<4600) cap='Now the path is clear!';
    else if(t<5300) cap='Last one…';
    else cap='Board cleared. That’s the whole game';
    if(cap!==this.lastCap){ this.lastCap=cap; $('demoCaption').textContent=cap; }
  }
};

/* ---------------------- app state & flow ---------------------- */
function freshFx(){
  return {fliers:[],flashes:[],edgeFlashes:[],particles:[],texts:[],
          shakes:new Map(),restores:new Map(),hint:null,boardPulse:0,cursor:null};
}
function DEFAULTS(){
  return {v:2,level:1,best:1,sound:true,palette:0,
          runSeed:(Math.random()*4294967296)>>>0,
          starsTotal:0,starsCount:0,flawless:0,bestCombo:0,
          daily:{date:'',done:false,bestMoves:0},rushBest:0};
}
const App={
  screen:'home', overlay:null, session:null, dirty:true,
  renderer:null, levelSeed:0, firstBlockCount:0,
  mode:'classic', rush:null, tut:false,
  platformSettled:false, hostAudio:true, pausedByHost:false,
  recentSigs:[], touchedPrefs:false,
  state:DEFAULTS(),
  fx:freshFx(),

  play(){ startMode('classic'); },

  tapArrow(arrow){
    const s=this.session;
    if(!s||s.completed||this.overlay) return;
    const fx=this.fx, now=performance.now();
    fx.hint=null;
    const res=s.tap(arrow);
    if(res.ok){
      spawnEscapeFx(arrow,s);
      AudioMgr.play('escape');
      const R=this.renderer, p=R.cellCenter(arrow.cell);
      if(s.mode==='rush'){
        fx.texts.push({x:p.x,y:p.y-R.cell*0.3,
          str:'+'+res.pts+(res.combo>=2?' ×'+res.combo:''),t0:now,color:'#FFD166'});
      }else if(res.combo>=2){
        fx.texts.push({x:p.x,y:p.y-R.cell*0.3,str:'×'+res.combo,t0:now,color:'#35E6A1'});
      }
      if(this.tut){ this.tut=false; UI.toast('Nice — now free the rest'); }
      UI.updateHud();
      this.dirty=true;
      if(s.alive===0){ this.onLevelClear(); return; }
      /* Safety net: dead ends are mathematically impossible in this design
         (removing arrows only clears paths), so this should never fire.
         Kept as a generation-bug guard, per the "treat as generator error" rule. */
      if(s.escapable().length===0){
        setTimeout(()=>{
          if(this.session===s&&!s.completed&&!this.overlay) UI.openOverlay('stuck');
        },600);
      }
    }else{
      if(this.firstBlockCount<2){
        this.firstBlockCount++;
        UI.toast('Blocked — another arrow is in its way');
      }
      fx.shakes.set(arrow.id,now);
      fx.flashes.push({t0:now,cells:res.info.cells,blockers:res.info.blockers});
      AudioMgr.play('blocked');
      UI.updateHud();
      this.dirty=true;
    }
  },
  undo(){
    const s=this.session;
    if(!s) return;
    const r=s.undo();
    if(r===undefined){ UI.toast('Nothing to undo'); return; }
    if(r!=null){
      this.fx.fliers=this.fx.fliers.filter(f=>f.id!==r);
      this.fx.restores.set(r,performance.now());
    }
    AudioMgr.play('undo');
    UI.updateHud();
    this.dirty=true;
  },
  hint(){
    const s=this.session;
    if(!s||s.completed||this.overlay) return;
    const alive=s.arrows.filter(a=>a.alive);
    if(!alive.length) return;
    /* Tiered help: first hint points at an escape; repeats also show the path. */
    let target=null;
    const res=solveSession(s,6000); // safe hint: first move of a found solution
    if(res.solved&&res.seq.length) target=s.arrows[res.seq[0]];
    else{ const esc=s.escapable(); if(esc.length) target=esc[0]; }
    if(!target){ UI.openOverlay('stuck'); return; } // unreachable safety net
    const tier=1+Math.min(s.hints,1);
    s.hints++;
    this.fx.hint={arrow:target,cells:s.pathInfo(target).cells,t0:performance.now(),
                  dur:2600,showPath:tier>=2,color:'#35E6A1'};
    AudioMgr.play('hint');
    UI.toast(tier>=2?'This arrow can escape — its path is clear'
                    :'This arrow can escape — look for its open path');
    if(s.mode==='rush'&&this.rush){
      this.rush.timeLeft=Math.max(0,this.rush.timeLeft-RUSH_HINT_PENALTY);
      UI.updateBarCount();
      if(this.rush.timeLeft<=0){ endRush(); return; }
    }
    this.dirty=true;
  },
  restart(){
    const s=this.session;
    if(!s) return;
    if(this.mode==='rush'){
      UI.closeOverlay(); startMode('rush'); UI.toast('Run restarted'); return;
    }
    UI.closeOverlay();
    /* Same seed, no anti-repeat filter → the identical board comes back. */
    startSession(Generator.generate(s.level,this.levelSeed),this.mode);
    UI.toast(this.mode==='daily'?'Puzzle restarted':'Level restarted');
  },
  pause(){
    if(this.screen!=='game'||this.overlay) return;
    const s=this.session;
    if(!s||s.completed) return;
    this.pausedByHost=false;
    AudioMgr.suspend(); Platform.gameplayStop();
    UI.openOverlay('pause');
  },
  resume(){
    if(this.overlay!=='pause') return;
    UI.closeOverlay();
    AudioMgr.resumeCtx(); Platform.gameplayStart();
  },
  goHome(){
    saveProgress();
    UI.closeOverlay();
    UI.showScreen('home');
    Platform.gameplayStop();
  },
  next(){
    const s=this.session;
    if(!s||s.completed) return;
    const lv=s.level+1;
    UI.closeOverlay();
    startSession(genClassic(lv),App.mode);
  },
  replay(){
    const s=this.session;
    if(!s) return;
    UI.closeOverlay();
    startMode(this.mode);
  },
  onLevelClear(){
    const s=this.session;
    if(!s||s.completed) return;
    s.completed=true;
    const st=this.state, now=performance.now();
    s.stars=3-(s.hints>0?1:0)-(s.failed>0?1:0);
    st.bestCombo=Math.max(st.bestCombo,s.comboBest);
    AudioMgr.play('complete');
    this.fx.boardPulse=now;
    spawnConfetti();
    this.dirty=true;

    if(s.mode==='rush'){ // rush chains straight into the next board, no overlay
      const r=this.rush;
      r.boards++; r.score+=50;
      r.timeLeft=Math.min(r.timeLeft+RUSH_BONUS,RUSH_CAP);
      const R=this.renderer;
      this.fx.texts.push({x:R.bx+R.bw/2,y:R.by+R.bh/2,str:'+10s',t0:now,color:'#FFD166'});
      UI.updateHud();
      setTimeout(()=>{
        if(App.mode==='rush'&&App.rush&&!App.rush.over&&App.session===s){
          startSession(genRushBoard(App.rush.boards),'rush');
        }
      },500);
      return;
    }

    if(s.mode==='daily'){
      const today=dailyKey(), first=!(st.daily.date===today&&st.daily.done);
      const better=first||!st.daily.bestMoves||s.moves<st.daily.bestMoves;
      if(st.daily.date!==today) st.daily={date:today,done:true,bestMoves:s.moves};
      else{ st.daily.done=true; if(better) st.daily.bestMoves=s.moves; }
      if(first){ st.starsTotal+=s.stars; st.starsCount++; if(s.stars===3) st.flawless++; }
      saveProgress();
      Platform.gameplayStop();
      UI.fillComplete(s,{first,better});
      setTimeout(()=>{ if(App.session===s) UI.openOverlay('complete'); },700);
      return;
    }

    /* classic */
    const lv=s.level;
    st.level=lv+1;
    const prevBest=st.best;
    st.best=Math.max(st.best,lv);
    st.starsTotal+=s.stars; st.starsCount++;
    if(s.stars===3) st.flawless++;
    saveProgress();
    Platform.gameplayStop();
    const unlocks=[];
    if(lv>prevBest){
      for(const p of PALETTES){ if(p.unlock===lv&&p.unlock>1) unlocks.push(p.name); }
    }
    UI.fillComplete(s,{unlocks});
    setTimeout(()=>{ if(App.session===s) UI.openOverlay('complete'); },700);
  },
  hostPause(){ // SDK onPause / tab hidden: pause execution + save
    AudioMgr.suspend();
    if(this.screen==='game'&&!this.overlay){
      const s=this.session;
      Platform.gameplayStop();
      if(s&&!s.completed){ this.pausedByHost=true; UI.openOverlay('pause'); }
    }
    saveProgress();
  },
  hostResume(){ // resume only when the host says so
    if(this.pausedByHost){
      this.pausedByHost=false;
      if(this.overlay==='pause'){
        UI.closeOverlay();
        if(this.screen==='game') Platform.gameplayStart();
      }
    }
    this.hostAudio=Platform.audioOn();
    AudioMgr.resumeCtx();
  },
  setSound(v,persist){
    this.state.sound=!!v;
    this.touchedPrefs=true;
    AudioMgr.setEnabled(v);
    UI.updateSoundUI();
    if(persist!==false) saveProgress();
  },
  hasActiveFx(){
    const fx=this.fx, now=performance.now();
    return fx.fliers.length>0||fx.flashes.length>0||fx.edgeFlashes.length>0||
           fx.particles.length>0||fx.texts.length>0||fx.shakes.size>0||
           fx.restores.size>0||!!fx.hint||
           (fx.boardPulse&&now-fx.boardPulse<600)||
           (fx.cursor&&now<fx.cursor.until);
  }
};
function ACOLORS(){
  const i=App.state?App.state.palette:0;
  return (PALETTES[i]||PALETTES[0]).colors;
}

/* ---------------------- level sources per mode ---------------------- */
function pushSig(board){
  App.recentSigs.push(Generator.sig(board,board.metrics));
  if(App.recentSigs.length>10) App.recentSigs.shift(); // bounded
}
function genClassic(level){
  const b=Generator.generate(level,hashSeed(App.state.runSeed,level),{recent:App.recentSigs});
  pushSig(b);
  return b;
}
function genRushBoard(k){
  const b=Generator.generate(Math.min(3+k*2,14),hashSeed(App.state.runSeed,777000+k),{recent:App.recentSigs});
  pushSig(b);
  return b;
}
function genDailyBoard(){ // same puzzle for everyone, per calendar day
  const pseudo=12+(new Date().getDate()%10);
  return Generator.generate(pseudo,strHash(dailyKey()));
}
function startMode(mode){
  AudioMgr.unlock();
  UI.showScreen('game');
  if(mode==='rush'){
    App.rush={timeLeft:RUSH_START,cap:RUSH_CAP,boards:0,score:0,running:true,over:false};
    startSession(genRushBoard(0),'rush');
  }else if(mode==='daily'){
    startSession(genDailyBoard(),'daily');
  }else{
    startSession(genClassic(App.state.level),'classic');
  }
}
function startSession(board,mode){
  App.mode=mode;
  App.levelSeed=board.seed;
  App.session=new Session(board,mode);
  App.fx=freshFx();
  UI.updateHud();
  App.renderer.resize();
  App.dirty=true;
  Platform.gameplayStart();
  maybeStartTutorial();
}
/* Level-1 tutorial: point at a real escape instead of front-loading rules. */
function maybeStartTutorial(){
  if(App.mode!=='classic'||!App.session||App.session.level!==1||App.state.best>1) return;
  App.tut=true;
  setTimeout(()=>{
    const s=App.session;
    if(!App.tut||!s||s.completed||s.moves>0||App.screen!=='game'||App.overlay) return;
    const esc=s.escapable();
    if(!esc.length) return;
    const a=esc[(Math.random()*esc.length)|0];
    App.fx.hint={arrow:a,cells:s.pathInfo(a).cells,t0:performance.now(),
                 dur:60000,showPath:false,color:'#FFD166'};
    UI.toast('Tap the glowing arrow — its path to the edge is clear',3400);
  },500);
}
function endRush(){
  const r=App.rush, s=App.session;
  if(!r||r.over) return;
  r.over=true; r.running=false;
  if(s&&!s.completed) s.completed=true;
  AudioMgr.play('complete');
  App.state.bestCombo=Math.max(App.state.bestCombo,s?s.comboBest:0);
  const nb=r.score>App.state.rushBest;
  if(nb) App.state.rushBest=r.score;
  saveProgress();
  Platform.gameplayStop();
  Platform.sendScore(r.score); // optional official score reporting (guarded)
  UI.fillResults(nb);
  setTimeout(()=>{ UI.openOverlay('results'); },600);
}

/* ---------------------- fx spawners (pixel snapshots) ---------------------- */
function spawnEscapeFx(a,s){
  const now=performance.now(), R=App.renderer, fx=App.fx, cols=ACOLORS();
  const steps=stepsToEdge(a.cell,a.dir,s.cols,s.rows);
  const c0=R.cellCenter(a.cell);
  const {dx,dy,ang}=DIRS[a.dir];
  const travel=(steps+1.7)*R.cell;
  const dur=REDUCED?170:430;
  fx.fliers.push({id:a.id,x0:c0.x,y0:c0.y,dx,dy,ang,color:cols[a.color],t0:now,dur,travel});
  const ex=c0.x+dx*steps*R.cell, ey=c0.y+dy*steps*R.cell;
  fx.edgeFlashes.push({t0:now+dur*Math.sqrt(steps/(steps+1.7)),x:ex,y:ey,dx,dy,color:cols[a.color]});
  if(REDUCED) return;
  for(let i=0;i<5;i++){
    fx.particles.push({
      x:ex,y:ey,
      vx:dx*(0.06+Math.random()*0.12)+(Math.random()-0.5)*0.12,
      vy:dy*(0.06+Math.random()*0.12)+(Math.random()-0.5)*0.12,
      g:0,life:380+Math.random()*220,maxLife:520,
      delay:dur*Math.sqrt(steps/(steps+1.7)),
      color:cols[a.color],size:2+Math.random()*2,shape:0,rot:0,vr:0
    });
  }
}
function spawnConfetti(){
  if(REDUCED) return;
  const R=App.renderer, fx=App.fx, cols=ACOLORS();
  const cx=R.bx+R.bw/2, cy=R.by+R.bh/2;
  for(let i=0;i<26;i++){
    const ang=Math.random()*Math.PI*2, sp=0.12+Math.random()*0.22;
    fx.particles.push({
      x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-0.18,g:0.0009,
      life:700+Math.random()*500,maxLife:1200,delay:0,
      color:cols[i%cols.length],size:3+Math.random()*3,
      shape:Math.random()<0.5?0:1,rot:Math.random()*3,vr:(Math.random()-0.5)*0.02
    });
  }
}

/* ---------------------- persistence ---------------------- */
function normalizeSave(raw){
  const d=DEFAULTS();
  if(!(raw&&typeof raw==='object'&&!Array.isArray(raw))) return d;
  const int=(v,def,min,max)=>{
    const n=(typeof v==='number'&&isFinite(v))?Math.floor(v):def;
    return clamp(n,min,max);
  };
  d.level=int(raw.level,1,1,999999);
  d.best=int(raw.best,1,1,999999);
  if(d.best<d.level) d.best=d.level;
  d.sound=raw.sound!==false;
  d.palette=int(raw.palette,0,0,PALETTES.length-1);
  d.starsTotal=int(raw.starsTotal,0,0,1e9);
  d.starsCount=int(raw.starsCount,0,0,1e9);
  d.flawless=int(raw.flawless,0,0,1e9);
  d.bestCombo=int(raw.bestCombo,0,0,1e9);
  d.rushBest=int(raw.rushBest,0,0,1e9);
  if(typeof raw.runSeed==='number'&&isFinite(raw.runSeed)&&raw.runSeed>=0) d.runSeed=raw.runSeed>>>0;
  if(raw.daily&&typeof raw.daily==='object'&&!Array.isArray(raw.daily)){
    const dt=raw.daily;
    if(typeof dt.date==='string'&&/^\d{4}-\d{1,2}-\d{1,2}$/.test(dt.date)){
      d.daily={date:dt.date,done:dt.done===true,bestMoves:int(dt.bestMoves,0,0,1e6)};
    }
  }
  return d;
}
function mergeSave(d){ // forward-merge so late-arriving cloud data never regresses
  const st=App.state;
  st.level=Math.max(st.level,d.level);
  st.best=Math.max(st.best,d.best);
  st.starsTotal=Math.max(st.starsTotal,d.starsTotal);
  st.starsCount=Math.max(st.starsCount,d.starsCount);
  st.flawless=Math.max(st.flawless,d.flawless);
  st.bestCombo=Math.max(st.bestCombo,d.bestCombo);
  st.rushBest=Math.max(st.rushBest,d.rushBest);
  if(!App.touchedPrefs){
    if(d.palette<=st.best||PALETTES[d.palette].unlock<=st.best) st.palette=d.palette;
    st.sound=d.sound; AudioMgr.setEnabled(d.sound);
  }
  const today=dailyKey();
  if(d.daily&&d.daily.date===today){
    if(st.daily.date!==today) st.daily={date:today,done:d.daily.done,bestMoves:d.daily.bestMoves};
    else{
      st.daily.done=st.daily.done||d.daily.done;
      const bm=[st.daily.bestMoves,d.daily.bestMoves].filter(v=>v>0);
      if(bm.length) st.daily.bestMoves=Math.min.apply(null,bm);
    }
  }
  UI.updateHome(); UI.renderSwatches(); UI.updateSoundUI();
}
function saveProgress(){
  const st=App.state;
  const data={v:2,level:st.level,best:st.best,sound:AudioMgr.enabled,palette:st.palette,
    runSeed:st.runSeed,starsTotal:st.starsTotal,starsCount:st.starsCount,
    flawless:st.flawless,bestCombo:st.bestCombo,rushBest:st.rushBest,daily:st.daily};
  Platform.save(JSON.stringify(data),data);
}
function doReset(){
  if(Platform.mode!=='playables') Storage.clear();
  Object.assign(App.state,DEFAULTS());
  App.session=null; App.rush=null; App.recentSigs=[];
  saveProgress(); // pushes fresh defaults to the active save mechanism
  UI.updateHome(); UI.renderSwatches(); UI.updateSoundUI();
  UI.toast('Progress reset');
}

/* ---------------------- input ---------------------- */
function moveCursor(key){
  const s=App.session; if(!s) return;
  const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[key];
  let cx,cy;
  const cur=App.fx.cursor;
  if(cur){ cx=cur.x; cy=cur.y; }
  else{
    const a=s.arrows.find(x=>x.alive); if(!a) return;
    cx=a.cell%s.cols; cy=(a.cell/s.cols)|0;
  }
  let x=cx+d[0], y=cy+d[1];
  while(x>=0&&x<s.cols&&y>=0&&y<s.rows){ // hop to the next alive arrow
    if(s.findAlive(y*s.cols+x)){ cx=x; cy=y; break; }
    x+=d[0]; y+=d[1];
  }
  App.fx.cursor={x:cx,y:cy,until:performance.now()+4000};
  App.dirty=true;
}
function attemptAtCursor(){
  const s=App.session; if(!s) return;
  if(!App.fx.cursor){
    const a=s.arrows.find(x=>x.alive); if(!a) return;
    App.fx.cursor={x:a.cell%s.cols,y:(a.cell/s.cols)|0,until:performance.now()+4000};
  }
  const cur=App.fx.cursor;
  const a=s.findAlive(cur.y*s.cols+cur.x);
  cur.until=performance.now()+4000;
  if(a) App.tapArrow(a);
}
function trapFocus(e,panel){
  const list=panel.querySelectorAll('button:not([disabled])');
  if(!list.length) return;
  const first=list[0], last=list[list.length-1], ae=document.activeElement;
  if(e.shiftKey&&(ae===first||ae===panel)){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&ae===last){ e.preventDefault(); first.focus(); }
}
function onKeydown(e){
  if(App.overlay){
    if(e.key==='Escape'){
      const id=OVERLAY_PRIMARY[App.overlay];
      if(id){ const b=$(id); if(b&&!b.disabled) b.click(); }
    }else if(e.key==='Tab'){
      trapFocus(e,UI.ov[App.overlay]);
    }
    return;
  }
  if(App.screen!=='game') return;
  const s=App.session; if(!s) return;
  switch(e.key){
    case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight':
      e.preventDefault(); moveCursor(e.key); break;
    case 'Enter': case ' ':
      e.preventDefault(); attemptAtCursor(); break;
    case 'h': case 'H': App.hint(); break;
    case 'u': case 'U': App.undo(); break;
    case 'r': case 'R': App.restart(); break;
    case 'p': case 'P': App.pause(); break;
  }
}

/* ---------------------- main loop & bootstrap ---------------------- */
let lastNow=performance.now(), firstFrameSent=false, gameReadySent=false;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(100,now-lastNow); lastNow=now;
  if(!firstFrameSent){ firstFrameSent=true; Platform.firstFrameReady(); }
  if(App.platformSettled&&!gameReadySent){ gameReadySent=true; Platform.gameReady(); }
  if(App.screen==='home'){
    Demo.render(now);
  }else{
    if(App.mode==='rush'&&App.rush&&App.rush.running&&!App.overlay&&
       App.session&&!App.session.completed){
      App.rush.timeLeft-=dt;
      if(App.rush.timeLeft<=0){ App.rush.timeLeft=0; UI.updateBarCount(); endRush(); }
      else UI.updateBarCount();
    }
    if(App.hasActiveFx()||App.dirty){
      App.renderer.render(now);
      App.dirty=false;
    }
  }
}
function onResize(){
  if(App.renderer) App.renderer.resize();
  Demo.resize();
}
function onPlatformReady(){
  App.platformSettled=true;
  if(Platform.mode==='playables'){
    document.body.classList.add('platform-playables');
    App.hostAudio=Platform.audioOn();
    /* Cloud save is the only progress mechanism in Playables; loadGame must
       complete before saveGame is ever called (enforced inside Platform). */
    Platform.loadCloud(data=>{
      if(data) mergeSave(normalizeSave(data));
    });
  }else{
    const local=Storage.read(); // standalone fallback only
    if(local) mergeSave(normalizeSave(local));
  }
  Platform.bindLifecycle({
    onPause(){ App.hostPause(); },
    onResume(){ App.hostResume(); }
  });
}
function bindInput(){
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',onResize);
  if(window.visualViewport) visualViewport.addEventListener('resize',onResize);
  if('ResizeObserver' in window) new ResizeObserver(onResize).observe($('boardWrap'));
  document.addEventListener('keydown',onKeydown);
  document.addEventListener('pointerdown',()=>AudioMgr.unlock());

  const canvas=$('board');
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    e.preventDefault();
    AudioMgr.unlock();
    if(App.screen!=='game'||App.overlay||!App.session||!App.renderer.cell) return;
    const rect=canvas.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const R=App.renderer, s=App.session;
    const cx=Math.floor((px-R.bx)/R.cell), cy=Math.floor((py-R.by)/R.cell);
    if(cx<0||cy<0||cx>=s.cols||cy>=s.rows) return;
    App.fx.cursor={x:cx,y:cy,until:performance.now()+2500};
    const arrow=s.findAlive(cy*s.cols+cx);
    if(arrow) App.tapArrow(arrow);
    App.dirty=true;
  },{passive:false});
}
function init(){
  UI.init();
  Demo.init();
  App.renderer=new Renderer($('board'),$('boardWrap'));
  App.renderer.resize();
  UI.showScreen('home');
  UI.renderSwatches();
  UI.updateSoundUI();
  AudioMgr.setEnabled(App.state.sound);
  bindInput();
  requestAnimationFrame(loop);
  Platform.init(onPlatformReady); // resolves fast; game is playable meanwhile

  /* Debug / reproducibility hook: same (level, seed) always rebuilds the
     same board; goto(n) jumps classic progression for testing. */
  window.Arrow47={
    version:'2.0.0',
    generate:(level,seed)=>Generator.generate(level|0,
      (seed==null?(Math.random()*4294967296)>>>0:seed)>>>0),
    goto(n){
      App.state.level=Math.max(1,n|0);
      App.state.best=Math.max(App.state.best,App.state.level);
      App.session=null;
      if(App.screen==='game') startMode('classic');
      UI.updateHome(); UI.renderSwatches();
    },
    startMode:m=>startMode(m)
  };
}
init();
})();
</script>
